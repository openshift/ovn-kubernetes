apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: anp-allow-ingress-from-ns-template
objects:
- apiVersion: policy.networking.k8s.io/v1alpha1
  kind: AdminNetworkPolicy
  metadata:
    name: "${NAME}"
  spec:
    priority: ${{PRIORITY}}
    subject:
      namespaces:
        matchLabels:
          kubernetes.io/metadata.name: "${SUBJECT_NS}"
    ingress:
    - name: "${RULE_NAME}"
      action: Allow
      from:
      - pods:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${FROM_NS}"
          podSelector: {}
parameters:
- name: NAME
- name: PRIORITY
- name: SUBJECT_NS
- name: FROM_NS
- name: RULE_NAME
