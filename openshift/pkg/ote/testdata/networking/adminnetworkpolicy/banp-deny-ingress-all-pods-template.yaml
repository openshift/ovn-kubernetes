apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: banp-deny-ingress-all-pods-template
objects:
- apiVersion: policy.networking.k8s.io/v1alpha1
  kind: BaselineAdminNetworkPolicy
  metadata:
    name: default
  spec:
    subject:
      namespaces:
        matchLabels:
          kubernetes.io/metadata.name: "${SUBJECT_NS}"
    ingress:
    - name: "${RULE_NAME}"
      action: Deny
      from:
      - pods:
          namespaceSelector: {}
          podSelector: {}
parameters:
- name: SUBJECT_NS
- name: RULE_NAME
