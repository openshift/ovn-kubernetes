apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: sec-localnet-net-ipblock
spec:
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values: ["a1", "a2"]
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: mylocalnet
      subnets: ["192.168.100.0/29"]
